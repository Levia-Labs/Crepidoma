- id: crepidoma-scrub
  name: crepidoma scrub (paths, emails, tokens, private names)
  description: Rejects local paths, emails, tokens and names listed in .scrub-denylist
  entry: crepidoma-scrub
  language: python
  types: [text]
- id: crepidoma-scrub-msg
  name: crepidoma scrub of commit message
  description: Rejects local paths, emails, tokens and denylisted names in the commit message
  entry: crepidoma-scrub
  language: python
  stages: [commit-msg]
- id: no-ai-attribution
  name: no AI attribution in commit message
  description: Rejects Claude co-author trailers and "Generated with Claude Code" lines
  entry: crepidoma-attribution msg
  language: python
  stages: [commit-msg]
- id: crepidoma-long-files
  name: crepidoma long-file ratchet
  description: Files over 300 lines must be baselined in .ratchet/long-files.baseline and may not grow
  entry: crepidoma-ratchet long-files --max-lines 300
  language: python
  types: [text]
- id: go-check
  name: go vet and test
  description: Runs task go:check; set GO_DIR through the including Taskfile
  entry: task go:check
  language: system
  pass_filenames: false
  files: \.go$|go\.(mod|sum)$
- id: go-fmt
  name: gofmt
  description: Rewrites Go files with gofmt and fails when it changed any
  entry: gofmt -l -w
  language: system
  types: [go]
