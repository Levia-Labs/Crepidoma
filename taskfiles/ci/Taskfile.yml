version: "3"

vars:
  CI_PY: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  CI_DIGEST: "{{.TASKFILE_DIR}}/../../plugins/crepidoma/scripts/digest.py"

tasks:
  status:
    desc: "Last 5 workflow runs, one line each. Usage: task ci:status"
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        command -v gh >/dev/null 2>&1 || { echo "missing gh: install https://cli.github.com" >&2; exit 1; }
        gh run list --limit 5 --json databaseId,status,conclusion,workflowName,headBranch \
          --jq '.[] | "\(.databaseId) \(.status)/\(.conclusion) \(.workflowName) \(.headBranch)"'

  fail:
    desc: "Failed-step log of the latest failed run, digested. Usage: task ci:fail"
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        command -v gh >/dev/null 2>&1 || { echo "missing gh: install https://cli.github.com" >&2; exit 1; }
        command -v uv >/dev/null 2>&1 || { echo "missing uv: install https://docs.astral.sh/uv/" >&2; exit 1; }
        id=$(gh run list --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
        [ -n "$id" ] || { echo "ci: no failed run"; exit 0; }
        echo "run $id"
        gh run view "$id" --log-failed 2>&1 | uv run --no-project {{.CI_PY}} "{{.CI_DIGEST}}"

  watch:
    desc: "Wait on the latest run, exit non-zero on failure. Usage: task ci:watch"
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        command -v gh >/dev/null 2>&1 || { echo "missing gh: install https://cli.github.com" >&2; exit 1; }
        id=$(gh run list --limit 1 --json databaseId --jq '.[0].databaseId')
        [ -n "$id" ] || { echo "ci: no runs"; exit 0; }
        gh run watch "$id" --exit-status >/dev/null && echo "run $id: success"
