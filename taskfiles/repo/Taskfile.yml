version: "3"

vars:
  REPO_SCRIPTS: "{{.TASKFILE_DIR}}/../../plugins/crepidoma/scripts"

tasks:
  outline:
    desc: "Outline headings of a file. Usage: task repo:outline -- <path> [--depth N]"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - uv run --no-project --python ">=3.12" "{{.REPO_SCRIPTS}}/repo_nav.py" outline {{.CLI_ARGS}}

  section:
    desc: "Print one section of a file. Usage: task repo:section -- <path> <name>"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - uv run --no-project --python ">=3.12" "{{.REPO_SCRIPTS}}/repo_nav.py" section {{.CLI_ARGS}}

  tasks:
    desc: "List Taskfile tasks. Usage: task repo:tasks -- [--grep PATTERN]"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - uv run --no-project --python ">=3.12" "{{.REPO_SCRIPTS}}/repo_nav.py" tasks {{.CLI_ARGS}}

  diff:
    desc: "Summarize changes against a base. Usage: task repo:diff -- [--base REF]"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - uv run --no-project --python ">=3.12" "{{.REPO_SCRIPTS}}/repo_nav.py" diff {{.CLI_ARGS}}

  read:
    desc: "Print at most 60 numbered lines. Usage: task repo:read -- FILE START END"
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - uv run --no-project --python ">=3.12" "{{.TASKFILE_DIR}}/../../tools/read_range.py" {{.CLI_ARGS}}

  digest:
    desc: >-
      Bounded digest of a file or stdin: size, headings, definitions or failures.
      Usage: task repo:digest -- <file>
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - uv run --no-project --python ">=3.12" "{{.REPO_SCRIPTS}}/digest.py" {{.CLI_ARGS}}

  scrub:text:
    desc: "Scrub a text file (PR draft) for private names. Usage: task repo:scrub:text -- <file>"
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - uv run --no-project --python ">=3.12" "{{.TASKFILE_DIR}}/../../tools/scrub_check.py" --strict {{.CLI_ARGS}}
