version: "3"

includes:
  shell: { taskfile: ./shell.yml, flatten: true }

vars:
  # default: {{.TASKFILE_DIR}}/../../configs; an including Taskfile may override
  LINT_CFG: '{{.LINT_CFG | default (printf "%s/../../configs" .TASKFILE_DIR)}}'
  LINT_RUFF: '{{.LINT_RUFF | default "uvx ruff"}}'
  LINT_YAMLLINT: '{{.LINT_YAMLLINT | default "uvx yamllint"}}'
  LINT_SG: '{{.LINT_SG | default "uvx --from ast-grep-cli ast-grep"}}'
  LINT_PRETTIER: '{{.LINT_PRETTIER | default "npx --no-install prettier"}}' # not --no: breaks on Windows
  LINT_PRETTIER_ARGS: '--ignore-unknown --log-level warn --config "{{.LINT_CFG}}/.prettierrc"'
  LINT_ESLINT: '{{.LINT_ESLINT | default "npx --no-install eslint"}}'
  LINT_PRECOMMIT: '{{.LINT_PRECOMMIT | default "uvx pre-commit"}}'

tasks:
  check:
    desc: Verify formatting and lint rules. Changes nothing; the form pre-commit and CI run.
    silent: true
    cmds:
      - task: python:check
      - task: yaml:check
      - task: shell:check
      - task: docker:check
      - task: web:check
      - task: sg
      - task: secrets

  run:
    desc: Format everything in place, then lint what has no formatter
    silent: true
    cmds:
      - task: python:run
      - task: shell:run
      - task: web:run
      - task: yaml:check

  check:files:
    desc: 'Lint a path list, rewriting nothing. Usage: task lint:check:files FILES="a.py b.sh" (or -- a.py b.sh)'
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      LIST: "{{.FILES | default .CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.LIST}}" ]'
        msg: 'No files. Pass FILES="a.py b.sh" or -- a.py b.sh'
    cmds:
      - |
        rc=0
        py="" sh="" yml="" pr="" es=""
        for f in {{.LIST}}; do
          case "$f" in
            *.py) py="$py $f" ;;
            *.sh|*.bash) sh="$sh $f" ;;
            *.yml|*.yaml) yml="$yml $f"; pr="$pr $f" ;;
            *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx) es="$es $f"; pr="$pr $f" ;;
            *.json|*.css|*.scss|*.md|*.html) pr="$pr $f" ;;
          esac
        done
        if [ -n "$py" ]; then
          {{.LINT_RUFF}} check --output-format concise --config "{{.LINT_CFG}}/ruff.toml" $py \
            && {{.LINT_RUFF}} format --check --config "{{.LINT_CFG}}/ruff.toml" $py || rc=1
        fi
        if [ -n "$sh" ]; then shellcheck $sh && shfmt -d -i 2 -ci $sh || rc=1; fi
        if [ -n "$pr" ]; then
          {{.LINT_PRETTIER}} --check {{.LINT_PRETTIER_ARGS}} $pr || rc=1
        fi
        if [ -n "$es" ]; then
          {{.LINT_ESLINT}} --max-warnings 0 --config "{{.LINT_CFG}}/eslint.config.js" $es || rc=1
        fi
        if [ -n "$yml" ]; then {{.LINT_YAMLLINT}} --strict -c "{{.LINT_CFG}}/.yamllint" $yml || rc=1; fi
        [ -n "$py$sh$pr$es$yml" ] || echo "nothing lintable in the given files"
        exit $rc

  files:
    desc: 'Format and fix a path list. Usage: task lint:files FILES="a.py b.sh" (or -- a.py b.sh)'
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      LIST: "{{.FILES | default .CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.LIST}}" ]'
        msg: 'No files. Pass FILES="a.py b.sh" or -- a.py b.sh'
    cmds:
      - |
        rc=0
        py="" sh="" yml="" pr="" es=""
        for f in {{.LIST}}; do
          case "$f" in
            *.py) py="$py $f" ;;
            *.sh|*.bash) sh="$sh $f" ;;
            *.yml|*.yaml) yml="$yml $f"; pr="$pr $f" ;;
            *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx) es="$es $f"; pr="$pr $f" ;;
            *.json|*.css|*.scss|*.md|*.html) pr="$pr $f" ;;
          esac
        done
        if [ -n "$py" ]; then
          {{.LINT_RUFF}} format --config "{{.LINT_CFG}}/ruff.toml" $py \
            && {{.LINT_RUFF}} check --fix --config "{{.LINT_CFG}}/ruff.toml" $py || rc=1
        fi
        if [ -n "$sh" ]; then shfmt -w -i 2 -ci $sh && shellcheck $sh || rc=1; fi
        if [ -n "$pr" ]; then
          {{.LINT_PRETTIER}} --write {{.LINT_PRETTIER_ARGS}} $pr || rc=1
        fi
        if [ -n "$es" ]; then
          {{.LINT_ESLINT}} --fix --max-warnings 0 --config "{{.LINT_CFG}}/eslint.config.js" $es || rc=1
        fi
        if [ -n "$yml" ]; then {{.LINT_YAMLLINT}} --strict -c "{{.LINT_CFG}}/.yamllint" $yml || rc=1; fi
        [ -n "$py$sh$pr$es$yml" ] || echo "nothing lintable in the given files"
        exit $rc

  python:check:
    desc: ruff lint and format check over the Python
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - '{{.LINT_RUFF}} check --output-format concise --config "{{.LINT_CFG}}/ruff.toml" .'
      - '{{.LINT_RUFF}} format --check --config "{{.LINT_CFG}}/ruff.toml" .'

  python:run:
    desc: ruff format and autofix over the Python
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - '{{.LINT_RUFF}} format --config "{{.LINT_CFG}}/ruff.toml" .'
      - '{{.LINT_RUFF}} check --fix --config "{{.LINT_CFG}}/ruff.toml" .'

  yaml:check:
    desc: yamllint --strict over the tracked YAML
    silent: true
    cmds:
      - task: _each
        vars:
          GLOBS: "'*.yml' '*.yaml'"
          CMD: '{{.LINT_YAMLLINT}} --strict -c "{{.LINT_CFG}}/.yamllint"'

  shell:check:
    desc: shellcheck and shfmt diff over the tracked shell scripts
    silent: true
    cmds:
      - task: _each
        vars: { GLOBS: "'*.sh' '*.bash'", CMD: "shellcheck" }
      - task: _each
        vars: { GLOBS: "'*.sh' '*.bash'", CMD: "shfmt -d -i 2 -ci" }

  shell:run:
    desc: shfmt in place over the tracked shell scripts
    silent: true
    cmds:
      - task: _each
        vars: { GLOBS: "'*.sh' '*.bash'", CMD: "shfmt -w -i 2 -ci" }

  docker:check:
    desc: hadolint over the tracked Dockerfiles
    silent: true
    cmds:
      - task: _each
        vars:
          GLOBS: "'*Dockerfile*'"
          CMD: 'hadolint --config "{{.LINT_CFG}}/.hadolint.yaml"'

  _each:
    desc: Run CMD on each tracked file matching GLOBS; stop at the first failure
    internal: true
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        for f in $(git ls-files -- {{.GLOBS}}); do
          [ -f "$f" ] || continue
          {{.CMD}} "$f" || exit 1
        done

  web:check:
    desc: prettier check and eslint with zero warnings, rewriting nothing
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - '{{.LINT_PRETTIER}} --check {{.LINT_PRETTIER_ARGS}} . "!.crepidoma/**"'
      - '{{.LINT_ESLINT}} --max-warnings 0 --no-error-on-unmatched-pattern --config "{{.LINT_CFG}}/eslint.config.js" .'

  web:run:
    desc: prettier write and eslint autofix in place
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - '{{.LINT_PRETTIER}} --write {{.LINT_PRETTIER_ARGS}} . "!.crepidoma/**"'
      - >-
        {{.LINT_ESLINT}} --fix --max-warnings 0 --no-error-on-unmatched-pattern
        --config "{{.LINT_CFG}}/eslint.config.js" .

  secrets:
    desc: gitleaks over the git history
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        cfg="{{.LINT_CFG}}/gitleaks.toml"
        if [ -f .gitleaks.toml ]; then cfg=.gitleaks.toml; fi
        if gitleaks git --help >/dev/null 2>&1; then set -- git; else set -- detect --source .; fi
        gitleaks "$@" --config "$cfg" --redact --no-banner

  sg:
    desc: ast-grep shared rules over the working directory
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - '{{.LINT_SG}} scan --config "{{.LINT_CFG}}/sgconfig.yml" --report-style short .'

  sg:file:
    desc: "ast-grep rules on one file. Usage: task lint:sg:file F=path/x.py [R=rule-id]"
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [F]
    cmds:
      - >-
        {{.LINT_SG}} scan --config "{{.LINT_CFG}}/sgconfig.yml" --report-style short
        {{if .R}}--filter {{shellQuote .R}}{{end}} {{shellQuote .F}}

  sg:test:
    desc: Each ast-grep rule against its own valid and invalid examples
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        if out=$({{.LINT_SG}} test --config "{{.LINT_CFG}}/sgconfig.yml" --skip-snapshot-tests 2>&1); then
          printf '%s\n' "$out" | tail -n 1
        else
          printf '%s\n' "$out"
          exit 1
        fi

  sg:find:
    desc: 'Structural search. Usage: task lint:sg:find P="subprocess.run($$$A)" [L=python] [IN="src tests"]'
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    requires:
      vars: [P]
    cmds:
      - '{{.LINT_SG}} run --lang {{.L | default "python"}} --pattern ''{{.P}}'' {{.IN | default "."}}'

  precommit:
    desc: Run every pre-commit hook over every file, not only the staged ones
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "{{.LINT_PRECOMMIT}} run --all-files"

  precommit:staged:
    desc: Run the pre-commit hooks over the staged files only
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "{{.LINT_PRECOMMIT}} run"

  precommit:setup:
    desc: Install the pre-commit, pre-push and commit-msg git hooks. Usage task lint:precommit:setup
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: command -v uv
        msg: "`uv` not on PATH. Install: https://docs.astral.sh/uv/getting-started/installation/"
    cmds:
      - "{{.LINT_PRECOMMIT}} install --hook-type pre-commit --hook-type pre-push --hook-type commit-msg"
      - uv run --no-project python "{{.TASKFILE_DIR}}/../../plugins/crepidoma/scripts/hook_shebang.py"

  precommit:autoupdate:
    desc: Bump the pre-commit hook revisions. Usage task lint:precommit:autoupdate
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - sh: command -v uv
        msg: "`uv` not on PATH. Install: https://docs.astral.sh/uv/getting-started/installation/"
    cmds:
      - "{{.LINT_PRECOMMIT}} autoupdate"

  precommit:where:
    desc: Print the installed git hook paths. Usage task lint:precommit:where
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        for h in pre-commit pre-push; do
          p=$(git rev-parse --git-path "hooks/$h")
          if [ -f "$p" ] && grep -q pre-commit "$p"; then echo "$h: $p"; else echo "$h: not installed"; fi
        done

  fmt:staged:
    desc: Format only the staged files with ruff and prettier, then re-add them. Usage task lint:fmt:staged
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - |
        files=$(git diff --cached --name-only --diff-filter=ACM)
        [ -n "$files" ] || { echo "nothing staged"; exit 0; }
        py="" pr=""
        for f in $files; do
          case "$f" in
            *.py) py="$py $f" ;;
            *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.json|*.css|*.scss|*.md|*.html|*.yml|*.yaml) pr="$pr $f" ;;
          esac
        done
        if [ -n "$py" ]; then {{.LINT_RUFF}} format --config "{{.LINT_CFG}}/ruff.toml" $py || exit 1; fi
        if [ -n "$pr" ]; then
          {{.LINT_PRETTIER}} --write {{.LINT_PRETTIER_ARGS}} $pr || exit 1
        fi
        [ -z "$py$pr" ] || git add -- $py $pr
