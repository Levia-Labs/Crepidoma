version: "3"

# Git operations. Read-only tasks plus `commit`, the only write task.

tasks:
  status:
    desc: "Short status with counts. Usage: task git:status"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    cmds:
      - git status --short --branch
      - |
        printf 'changed: %s\n' "$(git status --short | wc -l | tr -d ' ')"
        printf 'untracked: %s\n' "$(git status --short | grep -c '^??' || true)"

  head:
    desc: "Branch and last commit, one line. Usage: task git:head"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    cmds:
      - printf '%s ' "$(git rev-parse --abbrev-ref HEAD)" && git log -1 --format='%h %s'

  log:
    desc: "Last N commits, oneline. Usage: task git:log [N=10]"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      GIT_LOG_N: '{{.N | default "10"}}'
    cmds:
      - git log --oneline -n '{{.GIT_LOG_N}}'

  files:
    desc: "Changed files. Usage: task git:files"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    cmds:
      - git status --short

  after-merge:
    desc: >-
      Switch to default branch, ff-pull, update submodules, delete merged branches (or the named one),
      one receipt line. Usage: task git:after-merge -- <repo-path> [branch]
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      GIT_AM: "{{.TASKFILE_DIR}}/../../plugins/crepidoma/scripts/git_after_merge.py"
    preconditions:
      - sh: "{{if .CLI_ARGS}}true{{else}}false{{end}}"
        msg: "Repo path required. Usage: task git:after-merge -- <repo-path> [branch]"
    cmds:
      - uv run --no-project --python ">=3.12" "{{.GIT_AM}}" {{.CLI_ARGS}}

  commit:
    desc: >-
      Stage all, list staged files over the long-file cap, commit (one retry when a hook only
      reformatted files), push. Prints failed hook lines, commit id, push status.
      Usage: task git:commit -- "message"
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      GIT_COMMIT_RETRY: "{{.TASKFILE_DIR}}/commit_retry.py"
      GIT_LONG_STAGED: "{{.TASKFILE_DIR}}/../quality/staged_long_files.py"
    preconditions:
      - sh: "{{if .CLI_ARGS}}true{{else}}false{{end}}"
        msg: 'Commit message required. Usage: task git:commit -- "message"'
    cmds:
      - git add -A
      - uv run --no-project --python ">=3.12" "{{.GIT_LONG_STAGED}}"
      - uv run --no-project --python ">=3.12" "{{.GIT_COMMIT_RETRY}}" {{.CLI_ARGS}}
      - |
        if git rev-parse --abbrev-ref '@{u}' >/dev/null 2>&1; then
          git push --quiet && echo "push: ok"
        else
          git push --quiet -u origin HEAD && echo "push: ok (upstream set)"
        fi

  stage:
    desc: >-
      Stage exactly the given paths and print the staged list; refuses no paths, `.` and paths
      outside the repo. Subagent-safe in a shared checkout (never `git add -A`).
      Usage: task git:stage -- <path>...
    dir: "{{.USER_WORKING_DIR}}"
    silent: true
    vars:
      GIT_STAGE: "{{.TASKFILE_DIR}}/stage_paths.py"
    preconditions:
      - sh: "{{if .CLI_ARGS}}true{{else}}false{{end}}"
        msg: "Paths required. Usage: task git:stage -- <path>..."
    cmds:
      - uv run --no-project --python ">=3.12" "{{.GIT_STAGE}}" {{.CLI_ARGS}}
