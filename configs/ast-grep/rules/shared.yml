id: text-io-encoding
language: python
severity: error
message: Pass encoding="utf-8". The Windows default is cp1252, and mojibake surfaces far from here.
rule:
  all:
    - kind: call
    - not:
        has:
          field: arguments
          has:
            kind: keyword_argument
            regex: '^encoding\s*='
    - any:
        # Path text helpers: always text, whatever the other arguments.
        - has:
            field: function
            kind: attribute
            regex: '\.(read_text|write_text)$'
        # The builtin: text unless a binary mode literal appears, positional or mode=.
        - all:
            - has:
                field: function
                kind: identifier
                regex: "^open$"
            - not:
                has:
                  field: arguments
                  kind: string
                  regex: '^["''][rwax+tU]*b[rwax+tU]*["'']$'
                  stopBy: end
        # A .open() method: wave, zipfile and webbrowser have one too, so flag only the
        # shapes that are Path.open in text mode - no argument, a text mode, or newline=.
        - all:
            - has:
                field: function
                kind: attribute
                regex: '\.open$'
            # Order matters: `any` keeps the first branch that matches structurally, and a
            # MODE bound to `newline=""` would then fail the constraint and drop the match.
            - any:
                - has:
                    field: arguments
                    has:
                      kind: keyword_argument
                      regex: '^(newline|errors)\s*='
                - pattern: $P.open()
                - pattern: $P.open($MODE)
                - pattern: $P.open($MODE, $$$REST)
constraints:
  MODE:
    regex: '^["''][rwax+tU]{1,3}["'']$'
---
id: python-argv-python
language: python
severity: error
message: Ubuntu has no `python` binary by default - use "python3" or sys.executable.
files: ["tasks/**/*.py"]
rule:
  kind: string
  regex: ^["']python["']$
  inside: { kind: list }
---
id: taskfile-lowercase-tasks
language: yaml
severity: error
message: "Ubuntu is case-sensitive: the directory is tasks/."
files: [Taskfile.yml, "tasks/**/*.yml"]
rule:
  any:
    - kind: string_scalar
    - kind: block_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
  regex: '(^|[^\w])Tasks/'
---
id: taskfile-path-in-env
language: yaml
severity: error
message: go-task ignores PATH in env, even static. Resolve the binary in a sh var instead.
files: [Taskfile.yml, "tasks/**/*.yml"]
rule:
  any:
    - kind: block_mapping_pair
    - kind: flow_pair
  has: { field: key, regex: ^PATH$ }
  inside:
    any:
      - kind: block_mapping_pair
      - kind: flow_pair
    stopBy: end
    has: { field: key, regex: ^env$ }
---
id: taskfile-etc-drop-in
language: yaml
severity: error
message: Appending to a file under /etc duplicates the line every run and turns an upgrade into a conffile prompt. Write a drop-in.
files: [Taskfile.yml, "tasks/**/*.yml"]
rule:
  any:
    - kind: string_scalar
    - kind: block_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
  # An optional quote before /etc/ catches `>> "/etc/x"`. `tee -a "$FILE"` with the path in a
  # variable cannot be resolved statically and is not matched.
  regex: '(>>|tee\s+(-a|--append))\s*[''"]?/etc/'
  inside:
    any: [{ kind: block_mapping_pair }, { kind: flow_pair }]
    stopBy: end
    has: { field: key, regex: ^(cmds|sh|status|if)$ }
---
id: taskfile-no-double-bracket
language: yaml
severity: error
message: Taskfile shell stays POSIX sh - use `[`, not `[[`.
files: [Taskfile.yml, "tasks/**/*.yml"]
rule:
  any:
    - kind: string_scalar
    - kind: block_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
  # No lookahead: `[[` followed by anything but a colon, so the POSIX class `[[:space:]]`
  # inside a sed or grep expression is not mistaken for the bash test.
  regex: '\[\[([^:]|$)'
  inside:
    any: [{ kind: block_mapping_pair }, { kind: flow_pair }]
    stopBy: end
    has: { field: key, regex: ^(cmds|sh|status|if)$ }
---
id: taskfile-no-herestring
language: yaml
severity: error
message: Taskfile shell stays POSIX sh - no `<<<`. Pipe instead.
files: [Taskfile.yml, "tasks/**/*.yml"]
rule:
  any:
    - kind: string_scalar
    - kind: block_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
  regex: "<<<"
  inside:
    any: [{ kind: block_mapping_pair }, { kind: flow_pair }]
    stopBy: end
    has: { field: key, regex: ^(cmds|sh|status|if)$ }
---
id: taskfile-no-sed-in-place-repo
language: yaml
severity: error
message: A task must not `sed -i` a file in this repository. Edit system paths under /etc or $HOME only.
files: [Taskfile.yml, "tasks/**/*.yml"]
rule:
  any:
    - kind: string_scalar
    - kind: block_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
  # sed, optional flags such as -E or `-e <script>`, an in-place flag (-i, -i.bak, -ni,
  # --in-place), then a later token that starts a repository path: {{.ROOT_DIR}},
  # {{.TASKFILE_DIR}}, ./, a dot-directory such as .semgrep/, a relative tasks/, or any
  # relative token ending in a file extension (Taskfile.yml, docs/x.md) - go-task runs a
  # command in the Taskfile's directory, so a relative file is a repository file. A path
  # behind a shell variable ($ROOT/x) is not resolvable here and is not flagged.
  # `-e` takes its script as the next token, so without its own alternative a
  # `sed -e 's/a/b/' -i tasks/x` never reached the -i.
  # The gap is whole tokens: a quoted string may hold any character (`s|a|b|`, `s/a/b;c/`,
  # `s/x/&y/`), but an unquoted token stops at ; & |, so a path in a later command
  # (`sed -i ... /etc/x && cat tasks/y`) is not the sed's target. Tokens are separated by
  # blanks, never a newline: a comment line after a `sed -i` mention is not its arguments.
  regex: '\bsed\s+(?:-e\s+(?:''[^'']*''|"[^"]*"|\S+)\s+|-\S+\s+)*(?:-[A-Za-z]*i\S*|--in-place\S*)\s+(?:(?:''[^'']*''|"[^"]*"|[^\s''";&|]+)[ \t]+)*\\?["'']?(?:\{\{\s*\.(?:ROOT_DIR|TASKFILE_DIR)\s*\}\}|\./|\.\w[\w.-]*/|tasks/|[\w.-][^\s''";&|]*\.(?:ya?ml|md|toml|py|txt|json|sh|cfg|conf|ini|lock)(?:[\s''";&|]|$))'
  inside:
    any: [{ kind: block_mapping_pair }, { kind: flow_pair }]
    stopBy: end
    has: { field: key, regex: ^(cmds|sh|status|if)$ }
---
id: taskfile-lfs-install-skip-repo
language: yaml
severity: error
message: >-
  A bare `git lfs install` also writes hooks into the repository the task runs in
  and exits 2 once pre-commit owns pre-push. Use `git lfs install --skip-repo`.
files: [Taskfile.yml, "tasks/**/*.yml"]
rule:
  any:
    - kind: string_scalar
    - kind: block_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
  regex: '(?m)git lfs install[ \t]*($|[;&|)])'
  inside:
    any: [{ kind: block_mapping_pair }, { kind: flow_pair }]
    stopBy: end
    has: { field: key, regex: ^(cmds|sh|status|if)$ }
