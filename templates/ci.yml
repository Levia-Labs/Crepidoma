name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    uses: Levia-Labs/Crepidoma/.github/workflows/reusable-validate.yml@main
    with:
      python: true
      node: false
      types: true
      coverage: true

  # Runs the shared lint and security gates; they call the tools installed below.
  shared-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0 # history secret scans with .gitleaksignore fingerprints break on shallow clones
          persist-credentials: false
      - name: Install pinned gate tools
        run: |
          set -eu
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          gh=https://github.com
          curl -fsSL "$gh/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$bin" shellcheck-v0.11.0/shellcheck
          curl -fsSL -o "$bin/shfmt" "$gh/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64"
          curl -fsSL -o "$bin/hadolint" "$gh/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          curl -fsSL "$gh/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$bin" gitleaks
          chmod +x "$bin/shfmt" "$bin/hadolint"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      - run: task lint:check
      - run: task security:check
