# Merge into the pillar's root Taskfile.yml
includes:
  claude: .crepidoma/taskfiles/claude
  lint: .crepidoma/taskfiles/lint
  repo: .crepidoma/taskfiles/repo
  todo: .crepidoma/taskfiles/todo
  git: .crepidoma/taskfiles/git
  graph: .crepidoma/taskfiles/graph
  test: .crepidoma/taskfiles/test
  quality: .crepidoma/taskfiles/quality
  security: .crepidoma/taskfiles/security
  ci: .crepidoma/taskfiles/ci
  rtk: .crepidoma/taskfiles/rtk
  setup: .crepidoma/taskfiles/setup
  go: .crepidoma/taskfiles/go

# Override a shared config dir per include, e.g. use the pillar's root configs:
#   lint:
#     taskfile: .crepidoma/taskfiles/lint
#     vars: { LINT_CFG: "{{.ROOT_DIR}}" }
# Go pillars: include go with vars { GO_DIR: <module dir> }.
# Same for SECURITY_CONFIGS and QUALITY_CONFIGS. gitleaks prefers a root .gitleaks.toml when present.
