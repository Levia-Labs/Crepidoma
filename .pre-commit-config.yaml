default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.cmd$
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml, javascript]
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
  - repo: local
    hooks:
      - id: ast-grep
        name: ast-grep scan (shared rules)
        entry: ast-grep scan --config configs/sgconfig.yml
        language: python
        additional_dependencies: [ast-grep-cli==0.51.0]
        pass_filenames: false
      - id: crepidoma-scrub
        name: crepidoma scrub (paths, emails, tokens, private names)
        entry: uv run --no-project --quiet python tools/scrub_check.py
        language: system
        types: [text]
      - id: crepidoma-scrub-msg
        name: crepidoma scrub of commit message
        entry: uv run --no-project --quiet python tools/scrub_check.py
        language: system
        stages: [commit-msg]
      - id: no-ai-attribution
        name: no AI attribution in commit message
        entry: uv run --no-project --quiet python plugins/crepidoma/scripts/attribution.py msg
        language: system
        stages: [commit-msg]
      - id: docs-gate
        name: docs links and README file lists
        entry: uv run --no-project --quiet python plugins/crepidoma/scripts/docs_gate.py all
        language: system
        pass_filenames: false
        types: [markdown]
      - id: folder-readmes
        name: folder READMEs up to date
        entry: uv run --no-project --quiet python tools/folder_readme.py check
        language: system
        pass_filenames: false
      - id: crepidoma-long-files
        name: crepidoma long-file ratchet
        entry: uv run --no-project --quiet python tools/ratchet.py long-files --max-lines 300
        language: system
        types: [text]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: plugin-validate
        name: claude plugin validate
        entry: claude plugin validate .
        language: system
        pass_filenames: false
        stages: [pre-push]
